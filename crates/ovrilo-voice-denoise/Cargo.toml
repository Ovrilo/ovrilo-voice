[package]
name = "ovrilo-voice-denoise"
description = "Neural noise suppression and voice gate for the Ovrilo voice engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ovrilo-voice = { path = "../ovrilo-voice" }
# DeepFilterNet3 inference (MIT/Apache-2.0) with the model embedded; pinned, no crates.io release
# carries the tract runtime (ADR-0018).
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# libDF only builds against the tract release it was written for; later 0.21.x changed the API.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"

[lints]
workspace = true
