[package]
name = "ovrilo-voice-livekit"
description = "LiveKit transport and WebRTC audio processing for the Ovrilo voice engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ovrilo-voice = { path = "../ovrilo-voice" }
futures-util = "0.3"
livekit = { version = "0.9.5", default-features = false, features = ["native", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[dev-dependencies]
ovrilo-voice-cpal = { path = "../ovrilo-voice-cpal" }
livekit-api = { version = "0.9.0", default-features = false, features = ["access-token"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
